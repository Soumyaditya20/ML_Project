<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Prediction</title>
</head>
<body>
    <h2>Enter Patient Details</h2>
    <form action="/predict" method="post">
        <label>Age: <input type="number" name="age" required></label><br>
        <label>Sex (0 = Female, 1 = Male): <input type="number" name="sex" required></label><br>
        <label>Chest Pain Type (0-3): <input type="number" name="cp" required></label><br>
        <label>Resting Blood Pressure: <input type="number" name="trestbps" required></label><br>
        <label>Cholesterol: <input type="number" name="chol" required></label><br>
        <label>Fasting Blood Sugar (0 or 1): <input type="number" name="fbs" required></label><br>
        <label>Resting ECG (0-2): <input type="number" name="restecg" required></label><br>
        <label>Max Heart Rate Achieved: <input type="number" name="thalach" required></label><br>
        <label>Exercise Induced Angina (0 or 1): <input type="number" name="exang" required></label><br>
        <label>Oldpeak: <input type="number" step="0.1" name="oldpeak" required></label><br>
        <label>Slope (0-2): <input type="number" name="slope" required></label><br>
        <label>CA (0-4): <input type="number" name="ca" required></label><br>
        <label>Thal (0-3): <input type="number" name="thal" required></label><br>
        <button type="submit">Predict</button>
    </form>
</body>
</html>
